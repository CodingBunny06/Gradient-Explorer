name: Bug report
description: Report a reproducible problem in Gradient Explorer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include passwords, tokens, personal data, or security vulnerabilities here. Report security concerns privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enter ... 2. Select ... 3. Click ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior or error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser, and whether local or deployed.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add screenshots or relevant non-sensitive logs.
    validations:
      required: false
